{
  "table_name": "funnel_order_lifecycle",
  "main_dttm_col": "purchase_date",
  "currency_code_column": null,
  "description": "Dataset phễu vòng đời đơn hàng Olist. Mỗi đơn hàng sinh ra một dòng cho MỖI giai đoạn mà nó đã đi qua, nhờ vậy phép đếm theo giai đoạn cho ra đúng hình phễu, đồng thời vẫn giữ lại purchase_date và customer_state để lọc chéo (cross-filter) toàn dashboard.",
  "default_endpoint": null,
  "offset": 0,
  "cache_timeout": null,
  "schema": "gold",
  "catalog": "lakehouse",
  "sql": "SELECT\n    s.stage_order,\n    s.funnel_stage,\n    o.order_id,\n    CAST(o.purchase_timestamp AS DATE) AS purchase_date,\n    o.order_status,\n    c.customer_state,\n    o.payment_total\nFROM lakehouse.gold.fact_orders o\nLEFT JOIN lakehouse.gold.dim_customer c ON o.customer_key = c.customer_key\nCROSS JOIN (VALUES\n    (1, '1. Đặt hàng'),\n    (2, '2. Đã duyệt thanh toán'),\n    (3, '3. Đã bàn giao vận chuyển'),\n    (4, '4. Giao hàng thành công'),\n    (5, '5. Khách đã đánh giá')\n) AS s(stage_order, funnel_stage)\nWHERE s.stage_order = 1\n   OR (s.stage_order = 2 AND o.approval_date_key > 0)\n   OR (s.stage_order = 3 AND o.carrier_date_key > 0)\n   OR (s.stage_order = 4 AND o.delivered_date_key > 0)\n   OR (s.stage_order = 5 AND o.average_review_score IS NOT NULL)",
