  "schema": "gold",
  "catalog": "lakehouse",
  "sql": "WITH distinct_seller_orders AS (SELECT DISTINCT CAST(DATE_TRUNC('month', i.order_date) AS DATE) AS month_start, i.seller_key, i.order_id FROM lakehouse.gold.fact_order_items i), delivery AS (SELECT so.month_start, so.seller_key, COUNT_IF(o.delivery_duration_days IS NOT NULL) AS delivered_order_count, SUM(CASE WHEN o.delivery_duration_days IS NOT NULL THEN CAST(o.delivery_duration_days AS DOUBLE) ELSE 0.0 END) AS delivery_days_sum, COUNT_IF(o.delivery_duration_days IS NOT NULL AND NOT COALESCE(o.is_late_delivery, FALSE)) AS on_time_delivery_count FROM distinct_seller_orders so LEFT JOIN lakehouse.gold.fact_orders o ON so.order_id = o.order_id GROUP BY so.month_start, so.seller_key) SELECT m.month_start, m.seller_key, m.seller_id, m.seller_state, m.item_revenue, m.freight_total, m.item_count, m.order_count, m.average_delivery_days, m.on_time_delivery_rate, m.review_count, m.average_review_score, COALESCE(d.delivered_order_count, 0) AS delivered_order_count, COALESCE(d.delivery_days_sum, 0.0) AS delivery_days_sum, COALESCE(d.on_time_delivery_count, 0) AS on_time_delivery_count FROM lakehouse.gold.mart_seller_performance m LEFT JOIN delivery d ON m.month_start = d.month_start AND m.seller_key = d.seller_key",
