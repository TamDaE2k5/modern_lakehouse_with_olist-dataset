[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-lakehouse"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that exercise multiple project components",
    "docker: tests that require the Docker engine",
    "e2e: end-to-end lakehouse workflow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true
