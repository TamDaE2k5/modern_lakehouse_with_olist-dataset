x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/docker/airflow/Dockerfile
    target: airflow-runtime
  image: olist-lakehouse-airflow:2.11.2-spark-3.5.9
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@postgres:5432/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__METRICS__TIMER_UNIT_CONSISTENCY: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    AIRFLOW_FAILURE_LOG: /opt/airflow/logs/failures.ndjson
    AWS_ACCESS_KEY_ID: ${MINIO_PROCESSING_USER:?MINIO_PROCESSING_USER is required}
    AWS_SECRET_ACCESS_KEY: ${MINIO_PROCESSING_PASSWORD:?MINIO_PROCESSING_PASSWORD is required}
    AWS_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY: ${MINIO_UPLOAD_USER:?MINIO_UPLOAD_USER is required}
    S3_SECRET_KEY: ${MINIO_UPLOAD_PASSWORD:?MINIO_UPLOAD_PASSWORD is required}
    ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD is required}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_UPLOAD_ENDPOINT: http://minio:9000
    S3_REGION: ${S3_REGION:-us-east-1}
    ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://lakehouse/}
    SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
  volumes: &airflow-volumes
    - airflow-logs:/opt/airflow/logs
    - ./orchestration/dags:/opt/airflow/dags:ro
    - ./transformation:/opt/lakehouse/transformation:ro
    - ./data_quality:/opt/lakehouse/data_quality:ro
    - ./ingestion:/opt/lakehouse/ingestion:ro
    - ${OLIST_RAW_DIR:-./data/raw}:/opt/lakehouse/data/raw:ro
  restart: unless-stopped
  networks:
    - lakehouse-internal

services:
  airflow-init:
    <<: *airflow-common
    command: ["bash", "/opt/lakehouse/airflow/init.sh"]
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./infrastructure/docker/airflow/init.sh:/opt/lakehouse/airflow/init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: ["webserver"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8083}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      MAINTENANCE_APPROVAL_SECRET_FILE: /run/secrets/maintenance_approval_secret
    secrets:
      - source: maintenance_approval_secret
        target: /run/secrets/maintenance_approval_secret
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  airflow-tests:
    build:
      context: .
      dockerfile: infrastructure/docker/airflow/Dockerfile
      target: airflow-test
    image: olist-lakehouse-airflow-test:2.11.2-spark-3.5.9
    entrypoint: ["python", "-m", "pytest"]
    command:
      - tests/unit/orchestration/test_dag_imports.py
      - tests/unit/orchestration/test_dag_structure.py
      - tests/unit/orchestration/test_trigger_dagrun_behavior.py
      - tests/unit/maintenance
      - -q
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@postgres:5432/airflow
      MAINTENANCE_APPROVAL_SECRET_FILE: /run/secrets/maintenance_approval_secret
      OLIST_AIRFLOW_DB_RACE_TESTS: "1"
      PYTHONPATH: /opt/lakehouse
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lakehouse-internal
    secrets:
      - source: maintenance_approval_secret
        target: /run/secrets/maintenance_approval_secret
    profiles: ["test"]
    working_dir: /opt/lakehouse
    volumes:
      - ./orchestration:/opt/lakehouse/orchestration:ro
      - ./transformation:/opt/lakehouse/transformation:ro
      - ./ingestion:/opt/lakehouse/ingestion:ro
      - ./tests:/opt/lakehouse/tests:ro

  airflow-fixtures:
    <<: *airflow-common
    command: ["python", "--version"]
    environment:
      <<: *airflow-environment
      MAINTENANCE_APPROVAL_SECRET_FILE: /run/secrets/maintenance_approval_secret
    profiles: ["test"]
    restart: "no"
    secrets:
      - source: maintenance_approval_secret
        target: /run/secrets/maintenance_approval_secret
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./orchestration:/opt/lakehouse/orchestration:ro
      - ./transformation:/opt/lakehouse/transformation:ro
      - ./data_quality:/opt/lakehouse/data_quality:ro
      - ./ingestion:/opt/lakehouse/ingestion:ro
      - ./tests:/opt/lakehouse/tests:ro

volumes:
  airflow-logs:

secrets:
  maintenance_approval_secret:
    file: ./secrets/maintenance_approval_secret
