spark.eventLog.enabled                        true
spark.eventLog.compress                       true
spark.eventLog.dir                            file:///opt/spark-events
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                      lakehouse
spark.sql.catalog.lakehouse                   org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type              jdbc
spark.sql.catalog.lakehouse.uri               jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.lakehouse.jdbc.user          iceberg
spark.sql.catalog.lakehouse.jdbc.schema-version V1
spark.sql.catalog.lakehouse.warehouse          s3://lakehouse/
spark.sql.catalog.lakehouse.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint         http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.endpoint.region           us-east-1
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.sql.adaptive.enabled                     true
# spark.sql.iceberg.write.distribution-mode      hash
spark.sql.iceberg.write.target-file-size-bytes 134217728

# ==========================================
# CẤU HÌNH TỐI ƯU SHUFFLE CHO CỤM LOCAL (2-4 CORES)
# ==========================================
# 1. Giảm số phân vùng shuffle từ 200 xuống 4 (tiết kiệm 98% network socket)
spark.sql.shuffle.partitions                      4

# 2. Tắt ép buộc hash shuffle toàn cục khi ghi Iceberg
spark.sql.iceberg.write.distribution-mode         none

# 3. Tăng ngưỡng Broadcast Join lên 50MB (đưa dim_date, dim_seller vào RAM executor)
spark.sql.autoBroadcastJoinThreshold              52428800

# 4. Tự động gộp các phân vùng nhỏ trong Adaptive Query Execution (AQE)
spark.sql.adaptive.coalescePartitions.enabled     true
spark.sql.adaptive.coalescePartitions.initialPartitionNum 8
spark.sql.adaptive.coalescePartitions.minPartitionSize 1MB
